      "articleBody": "Dans les vieilles maisons, la rampe d'escalier porte un lustre qu'aucun vernis ne sait imiter. Des milliers de mains l'ont prise sans y penser, chacune y laissant un passage infime, et c'est cette caresse répétée sur des générations qui a fini par donner au bois sa lumière. Les antiquaires appellent cela la patine, et ils la prisent au point qu'un meuble décapé de la sienne perd l'essentiel de sa valeur, parce qu'on peut refaire un vernis mais jamais un siècle de mains. J'aime qu'il existe une beauté que l'usage seul sait fabriquer, et que personne ne peut acheter pressée. Nous gardons pourtant tant de choses à l'abri, la vaisselle des grands jours, la belle nappe, les mots qui comptent, de peur que l'usure les abîme. Les rampes polies racontent le contraire : ce qui est touché souvent s'embellit, pendant que ce qui dort dans les armoires garde son prix et perd sa vie. Qu'est-ce que je range pour les grandes occasions, qui attend seulement des mains pour commencer à briller?",
      "workTranslation": {
            "@type": "BlogPosting",
            "headline": "The patina",
            "inLanguage": "en",
            "articleBody": "In old houses, the stair rail carries a sheen that no varnish knows how to imitate. Thousands of hands have taken hold of it without thinking, each leaving the faintest trace of its passing, and it is that caress repeated across generations that has finally given the wood its light. Antique dealers call this the patina, and they prize it so highly that a piece stripped of its own loses most of its value, because a varnish can be redone but never a century of hands. I love that there is a beauty only use knows how to make, one that nobody can buy in a hurry. Yet we keep so many things out of harm's way, the china for special days, the fine tablecloth, the words that matter, for fear that wear will spoil them. The polished rails tell the opposite story: what is touched often grows more beautiful, while what sleeps in the cupboards keeps its price and loses its life. What have I put away for the great occasions, though it would begin to shine the moment hands took hold of it?"
      }
