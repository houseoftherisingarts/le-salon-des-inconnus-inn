      "articleBody": "Ce matin, j'ai commencé à corder le bois pour l'hiver, en plein soleil de juillet. Les mains font le geste pendant que la tête le trouve absurde : préparer du feu quand tout le pays brûle déjà de chaleur. Mais chaque bûche placée aujourd'hui est une soirée de janvier qui existe déjà, quelque part, en attente. Les stoïciens parlaient de se préparer à ce qui vient; moi, j'ai plutôt l'impression d'écrire une lettre à quelqu'un que je n'ai pas encore rencontré, l'inconnu qui se réchauffera à ce feu. Les gestes les plus généreux se posent des mois avant d'être reçus, sans témoin. Peut-être que tout ce qu'on fait de bien dans une vie ressemble à ça : du bois cordé en été pour des feux qu'on n'allumera pas soi-même.",

        "headline": "July firewood",
        "inLanguage": "en",
        "articleBody": "This morning I started stacking firewood for winter, under the full July sun. The hands do the work while the head calls it absurd: preparing for fire when the whole countryside is already burning with heat. But every log placed today is a January evening that already exists, somewhere, waiting. The Stoics spoke of preparing for what comes; to me it feels more like writing a letter to someone I have not yet met, the stranger who will warm themselves by this fire. The most generous gestures are made months before they are received, with no witness. Maybe everything good we do in a life looks like this: wood stacked in summer for fires we will not light ourselves."
