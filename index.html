      "articleBody": "Les framboises sont arrivées d'un coup le long de la clôture, comme chaque fin de juillet. C'est un fruit qui ne sait pas attendre : cueilli le matin, il veut être mangé le jour même, et celui qu'on laisse sur la tige pour demain est souvent déjà passé. Cette abondance ne se négocie pas : on se présente à son heure ou on la manque. Alors les bols circulent vers la table des invités, et les enfants reviennent de la clôture les doigts tachés de rouge, incapables d'attendre le bol. Je pense à tout ce qui mûrit de la même façon dans une vie : une conversation devenue possible, un pardon, l'âge exact où un enfant veut encore qu'on le porte. Ces choses-là n'attendent pas non plus que notre horaire se libère. La clôture est pleine cette semaine; qu'est-ce qui est mûr, là, dans ma journée, et que je remets à demain?",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "Raspberry season",
        "inLanguage": "en",
        "articleBody": "The raspberries arrived all at once along the fence, the way they do every late July. It is a fruit that does not know how to wait: picked in the morning, it wants to be eaten that same day, and the one left on the cane for tomorrow is often already gone. That kind of abundance cannot be negotiated with: you show up at its hour or you miss it. So the bowls travel to the guests' table, and the children come back from the fence with red-stained fingers, unable to wait for a bowl. I think of everything that ripens the same way in a life: a conversation that has become possible, a forgiveness, the exact age when a child still wants to be carried. Those things do not wait for our schedule to clear either. The fence is full this week; what is ripe, right now, in my day, that I keep putting off until tomorrow?"
      }
    }
