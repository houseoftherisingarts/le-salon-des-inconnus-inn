      "articleBody": "Chaque année au début d'août, les Perséides traversent le ciel, et chaque année j'oublie la leçon qu'elles répètent. Pour les voir, il faut d'abord éteindre : les lampes, les écrans, la conversation. Puis il faut attendre, parce que l'œil met une bonne vingtaine de minutes à s'ouvrir vraiment à l'obscurité; le ciel qui semblait vide se peuple alors d'étoiles qu'on aurait juré absentes. Elles étaient là depuis le début, et c'est nous qui n'étions pas prêts à les recevoir. Je me demande combien de choses fonctionnent ainsi : des présences discrètes qui n'apparaissent qu'à ceux qui restent assez longtemps dans le noir sans le fuir. La patience n'est peut-être que cela, laisser à nos yeux le temps de s'accorder à ce qui est déjà là. Qu'est-ce que je déclare absent, ce soir, simplement parce que je n'ai pas encore attendu assez longtemps?",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "The patience of the stars",
        "inLanguage": "en",
        "articleBody": "Every year in early August, the Perseids cross the sky, and every year I forget the lesson they repeat. To see them, you first have to turn things off: the lamps, the screens, the conversation. Then you have to wait, because the eye needs a good twenty minutes to truly open to the dark; the sky that seemed empty then fills with stars you would have sworn were absent. They were there from the beginning, and we were the ones not yet ready to receive them. I wonder how many things work that way: quiet presences that only reveal themselves to those who stay in the dark long enough without fleeing it. Maybe patience is only that, giving our eyes the time to attune to what is already there. What am I declaring absent tonight, simply because I have not yet waited long enough?"
