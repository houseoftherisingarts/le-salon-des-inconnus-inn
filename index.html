      "inLanguage": "fr",

      "articleBody": "Mes enfants peuvent jouer des heures sans jamais demander à quoi ça sert. La partie commence, monte, éclate de rire, se termine, et personne ne réclame de trophée : le jeu s'est suffi à lui-même. Les grands, eux, apprennent lentement à jouer pour gagner quelque chose, un résultat, une reconnaissance, une ligne de plus au bilan, et c'est souvent par cette porte que la joie s'en va. Alan Watts disait que la vie ressemble à la musique : personne n'écoute une symphonie pour arriver au dernier accord. Ce qui compte se passe pendant. J'essaie de m'en souvenir dans mon travail, faire de la journée une partie qu'on joue pour la beauté du jeu. À quel moment, aujourd'hui, est-ce que je jouerai pour rien?",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "Playing for nothing",
        "inLanguage": "en",
        "articleBody": "My children can play for hours without ever asking what it is for. The game begins, builds, bursts into laughter, ends, and nobody demands a trophy: the game was enough in itself. Grown-ups slowly learn to play in order to win something, a result, a bit of recognition, one more line on the ledger, and that is often the door through which the joy leaves. Alan Watts said life is like music: nobody listens to a symphony in order to reach the final chord. What matters happens along the way. I try to remember this in my work, to make the day a game played for the beauty of playing. At what moment today will I play for nothing?"
