      "articleBody": "Les boulangers d'autrefois ne partaient jamais de rien. Au fond d'un pot, ils gardaient un peu de pâte vivante de la fournée précédente, et ce levain portait en lui toutes les fournées qui l'avaient précédé, parfois sur plusieurs générations. Quand un voisin voulait se mettre au pain, on lui en donnait une poignée, et le don n'appauvrissait personne : nourri de farine et d'eau, le levain repousse chez celui qui le reçoit pendant qu'il continue de lever chez celui qui l'a donné. J'aime cette forme de richesse qui grandit en se partageant. Les conversations autour d'une table me semblent faites de la même matière : une histoire donnée à des inconnus continue de vivre chez eux sans quitter celui qui l'a racontée, et elle revient parfois transformée, comme un levain qui a pris le goût d'une autre maison. Quelle poignée de vivant est-ce que je pourrais donner aujourd'hui, sans rien perdre?",
      "workTranslation": {
            "@type": "BlogPosting",
            "headline": "The starter",
            "inLanguage": "en",
            "articleBody": "Bakers of old never started from nothing. At the bottom of a jar they kept a little living dough from the previous batch, and that starter carried within it all the batches that had come before, sometimes across several generations. When a neighbour wanted to take up bread-making, they were given a handful of it, and the gift made nobody poorer: fed with flour and water, the starter grows back in the hands of the one who receives it while it keeps on rising in the home of the one who gave it. I love this form of wealth that grows by being shared. Conversations around a table seem to me to be made of the same substance: a story given to strangers goes on living in them without ever leaving the one who told it, and it sometimes comes back transformed, like a starter that has taken on the taste of another house. What handful of something living could I give away today, without losing anything?"
