      "inLanguage": "fr",
      "url": "https://www.lesalondesinconnus.com/pensees/2026-08-01",
      "mainEntityOfPage": "https://www.lesalondesinconnus.com/pensees/2026-08-01",
      "isPartOf": { "@type": "Blog", "name": "Pensées, le journal quotidien du Salon des Inconnus", "url": "https://www.lesalondesinconnus.com/pensees" },
      "author": { "@type": "Organization", "name": "Le Salon des Inconnus", "url": "https://www.lesalondesinconnus.com" },
      "publisher": { "@type": "Organization", "name": "Le Salon des Inconnus", "url": "https://www.lesalondesinconnus.com" },
      "articleBody": "Dans les vieilles traditions, on dressait un couvert de plus à la table du soir : la place du voyageur, celle de l'invité que personne n'attendait encore. On ne savait pas qui viendrait, et c'est justement pour cela qu'on préparait sa place. J'aime ce geste posé d'avance pour quelqu'un qui n'a pas encore de visage; il dit que la maison reste tournée vers le monde, même une fois la nuit tombée. Nos journées, elles, sont souvent dressées serré : chaque heure a son assiette, chaque minute son ustensile, et l'imprévu qui se présente ne trouve nulle part où s'asseoir. Pourtant, ce qui m'a le plus nourri dans une vie est presque toujours arrivé sans réservation : une rencontre, une idée, un détour. Garder une place libre demande une drôle de confiance, celle de croire que ce qui viendra la remplir vaudra mieux que tout ce qu'on aurait pu planifier. Ce matin, je me demande où se trouve le couvert de plus dans ma journée.",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "The extra place",
        "inLanguage": "en",
        "articleBody": "In the old traditions, an extra place was set at the evening table: the traveller's seat, the place of the guest nobody was expecting yet. People did not know who would come, and that is exactly why they prepared a spot. I love that gesture, made in advance for someone who does not yet have a face; it says the house stays turned toward the world, even after night has fallen. Our days, though, are often set tight: every hour has its plate, every minute its fork, and the unexpected that shows up finds nowhere to sit. Yet what has nourished me most in this life almost always arrived without a reservation: an encounter, an idea, a detour. Keeping one seat free asks for a strange kind of trust, the trust that whatever comes to fill it will be worth more than anything we could have planned. This morning I wonder where the extra place is in my day."
      }
    }
