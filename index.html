      "articleBody": "Il arrive un moment, tard dans la soirée, où la conversation retombe d'elle-même et où personne ne se dépêche de la relancer. Longtemps, ce vide m'a fait peur; je le bouchais avec n'importe quoi, une anecdote, une question, un commentaire sur la météo. Pourtant, ce silence est souvent le signe que la rencontre a réussi : on ne se tait ensemble que lorsqu'on a cessé d'avoir peur d'être jugé. Deux inconnus qui regardent le même feu sans parler se disent quelque chose que les mots auraient abîmé. Alors j'apprends à ne plus secourir ces silences, à les laisser durer une respiration de plus. Les musiciens le savent depuis toujours : sans les silences, il n'y aurait que du bruit. Avec qui, dans ma vie, est-ce que je peux me taire sans que rien se brise?",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "Shared silence",
        "inLanguage": "en",
        "articleBody": "There comes a moment, late in the evening, when the conversation settles down on its own and nobody hurries to revive it. For a long time that emptiness scared me; I would plug it with anything at hand, an anecdote, a question, a remark about the weather. Yet that silence is often the sign that the encounter has succeeded: we only fall quiet together once we have stopped being afraid of being judged. Two strangers watching the same fire without speaking are telling each other something words would have damaged. So I am learning to stop rescuing those silences, to let them last one more breath. Musicians have always known this: without the silences, there would be nothing but noise. Who in my life can I share a silence with, without anything breaking?"

    }
