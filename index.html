      "articleBody": "Certains matins d'août se lèvent enveloppés de brume, et le monde entier semble réduit à quelques pas de large. La forêt, les collines, la route : tout existe encore, mais sur parole. Marcher là-dedans m'enseigne une chose que mes plans ne m'enseignent jamais : quelques mètres de visibilité suffisent pour avancer, et le chemin se dévoile à mesure qu'on lui fait confiance. Nous exigeons pourtant de nos vies une clarté que la nature n'accorde presque jamais; nous voulons voir la route entière avant de poser le premier pas. La brume a sa propre générosité : elle rend le monde à petites doses, un pas à la fois, et redonne au paysage le plus familier son air de première fois. Puis le soleil monte, le voile se lève, et on découvre qu'on a traversé sans encombre tout ce qu'on ne voyait pas. De combien de mètres de visibilité ai-je vraiment besoin, ce matin, pour faire le premier pas?",
      "workTranslation": {
        "@type": "BlogPosting",
        "headline": "Morning fog",
        "inLanguage": "en",
        "articleBody": "Some August mornings rise wrapped in fog, and the whole world seems reduced to a few steps across. The forest, the hills, the road: everything still exists, but on its word alone. Walking in it teaches me something my plans never do: a few metres of visibility are enough to keep going, and the way reveals itself as you learn to trust it. Yet we demand from our lives a clarity that nature almost never grants; we want to see the whole road before taking the first step. The fog has its own generosity: it hands the world back in small doses, one step at a time, and gives the most familiar landscape its air of a first encounter. Then the sun climbs, the veil lifts, and we discover we have passed unharmed through everything we could not see. How many metres of visibility do I really need, this morning, to take the first step?"
