<!doctype html>
<html><body style="margin:0;background:#1a0f08">
<canvas id="c" width="256" height="256"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
const draco = new DRACOLoader(); draco.setDecoderPath('/draco/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const canvas = document.getElementById('c');
const rendu = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
rendu.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2a1a, 1.4));
const lampe = new THREE.DirectionalLight(0xffe9c4, 2.2); lampe.position.set(3, 6, 5); scene.add(lampe);
const dore = new THREE.DirectionalLight(0xd4af37, 0.8); dore.position.set(-4, 2, 3); scene.add(dore);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
// `taille` : le côté du rendu (256 pour les vignettes, 1024 pour les grands
// portraits de l'écran VS); `cadre` resserre la caméra (1.85 vignette, 2.2 portrait).
window.rendre = (id, fond, taille = 256, cadre = 1.85) => new Promise((ok, ko) => {
  rendu.setSize(taille, taille, false);
  loader.load(`/models/convives/${id}.glb`, (g) => {
    const s = g.scene;
    s.traverse((o) => { const m = o.material; if (m?.isMeshStandardMaterial) { m.metalness = 0; m.roughness = 0.72; m.metalnessMap = null; m.roughnessMap = null; m.needsUpdate = true; } });
    const boite = new THREE.Box3().setFromObject(s);
    const taille = boite.getSize(new THREE.Vector3()); const centre = boite.getCenter(new THREE.Vector3());
    s.position.sub(centre);
    const h = Math.max(taille.x, taille.y, taille.z);
    camera.position.set(0, h * 0.04, h * cadre); camera.lookAt(0, 0, 0);
    scene.background = fond ? new THREE.Color(fond) : null;
    scene.add(s); rendu.render(scene, camera); scene.remove(s);
    ok(canvas.toDataURL('image/webp', 0.86));
  }, undefined, ko);
});
</script></body></html>
